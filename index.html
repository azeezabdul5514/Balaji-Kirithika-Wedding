<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Priya & Karthik — Wedding Invitation</title>
<meta name="description" content="You are invited to the wedding of Priya & Karthik">
<meta property="og:title" content="Priya & Karthik — Wedding Invitation">
<meta property="og:description" content="Tap to open our wedding invitation">
<meta name="theme-color" content="#5a1420">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --cream: #fbf4e8;
  --paper: #fffcf6;
  --maroon: #7a1f2b;
  --maroon-dark: #4a0f18;
  --gold: #c19a4b;
  --gold-light: #ecd79f;
  --marigold: #f29a1f;
  --marigold-light: #ffc94a;
  --leaf: #3f7d3a;
  --leaf-dark: #2b5a28;
  --rose: #e9b8b0;
  --text: #4a3b36;
  --muted: #8a7568;
  --nav-h: 64px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--cream);
  color: var(--text);
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  line-height: 1.7;
  overflow-x: hidden;
}
body.locked { overflow: hidden; height: 100svh; }
a { color: inherit; }
button, input, select { font: inherit; }

/* ============ TEMPLE DOORS INTRO ============ */
#doors { position: fixed; inset: 0; z-index: 9999; perspective: 1600px; }
#doors.gone { visibility: hidden; transition: visibility 0s 1.6s; }
.door {
  position: absolute; top: 0; bottom: 0; width: 50%;
  background:
    radial-gradient(circle, rgba(236,215,159,.22) 1.4px, transparent 1.6px) 0 0 / 22px 22px,
    linear-gradient(170deg, var(--maroon) 0%, var(--maroon-dark) 100%);
  transition: transform 1.5s cubic-bezier(.7,0,.25,1);
  box-shadow: inset 0 0 60px rgba(0,0,0,.35);
}
.door::before {
  content: ''; position: absolute; inset: 16px;
  border: 2px solid var(--gold); border-radius: 6px;
  box-shadow: inset 0 0 0 6px transparent, inset 0 0 0 7px rgba(193,154,75,.5);
}
.door::after {                      /* door knocker ring */
  content: ''; position: absolute; top: 50%; width: 26px; height: 26px; margin-top: 150px;
  border: 3px solid var(--gold); border-radius: 50%;
}
.door-left  { left: 0;  transform-origin: left center; }
.door-right { right: 0; transform-origin: right center; }
.door-left::after  { right: 22px; }
.door-right::after { left: 22px; }
#doors.open .door-left  { transform: rotateY(-105deg); }
#doors.open .door-right { transform: rotateY(105deg); }
.seal {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  background: none; border: 0; cursor: pointer; z-index: 2; color: var(--gold-light);
  transition: opacity .5s ease, transform .5s ease;
}
#doors.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
.seal-circle {
  width: 128px; height: 128px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f6e2a8, var(--gold) 55%, #8d6a26 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Great Vibes', cursive; font-size: 36px; color: var(--maroon-dark);
  box-shadow: 0 0 0 6px rgba(193,154,75,.25), 0 10px 30px rgba(0,0,0,.4);
  animation: sealPulse 2s ease-in-out infinite;
}
@keyframes sealPulse { 0%,100% { box-shadow: 0 0 0 6px rgba(193,154,75,.25), 0 10px 30px rgba(0,0,0,.4); } 50% { box-shadow: 0 0 0 16px rgba(193,154,75,0), 0 10px 30px rgba(0,0,0,.4); } }
.seal-for { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px; }
.seal-tap { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.seal-tap i { animation: tapBob 1.4s ease-in-out infinite; }
@keyframes tapBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* ============ PETALS ============ */
#petals { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.petal { position: absolute; top: -30px; opacity: 0; animation: fall linear forwards; }
@keyframes fall {
  0% { opacity: 0; transform: translateY(0) rotate(0) translateX(0); }
  10% { opacity: .85; }
  90% { opacity: .6; }
  100% { opacity: 0; transform: translateY(110vh) rotate(540deg) translateX(60px); }
}

/* ============ REVEAL ============ */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity .9s cubic-bezier(.22,.61,.36,1), transform .9s cubic-bezier(.22,.61,.36,1); }
.reveal.visible { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  .door { transition-duration: .01s; }
  .mandala, .garland-item, #petals { animation: none !important; }
}

.page { max-width: 560px; margin: 0 auto; padding: 0 18px; position: relative; z-index: 1; }
section { scroll-margin-top: 20px; }

/* ============ HERO ============ */
#home {
  min-height: 100svh; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 110px 22px 90px;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(193,154,75,.28), transparent 60%),
    linear-gradient(175deg, var(--maroon) 0%, var(--maroon-dark) 100%);
  color: var(--cream);
}
/* Thoranam: mango leaf + marigold garland */
.garland { position: absolute; top: 0; left: 0; right: 0; height: 90px; display: flex; justify-content: space-between; padding: 0 4px; z-index: 3; }
.garland::before { content: ''; position: absolute; top: 6px; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #a87a2a, var(--gold-light), #a87a2a); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.garland-item { position: relative; top: 7px; transform-origin: top center; animation: sway 3.2s ease-in-out infinite alternate; }
.garland-item svg { display: block; width: 18px; height: 46px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.garland-item.flower { display: flex; flex-direction: column; align-items: center; }
.garland-item.flower span { width: 14px; height: 14px; border-radius: 50%; margin-top: -2px; background: radial-gradient(circle at 40% 35%, var(--marigold-light), var(--marigold) 60%, #c86a0a); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.garland-item.flower span:first-child { margin-top: 0; }
@keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

.mandala {
  position: absolute; left: 50%; top: 50%; width: min(560px, 140vw); height: min(560px, 140vw);
  margin: calc(min(560px, 140vw) / -2) 0 0 calc(min(560px, 140vw) / -2);
  color: var(--gold); opacity: .28; animation: spin 90s linear infinite; pointer-events: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hero-frame { position: absolute; inset: 104px 16px 16px; border: 1px solid rgba(236,215,159,.35); border-radius: 180px 180px 6px 6px; pointer-events: none; }
.hero-inner { position: relative; z-index: 2; }
.hero-symbol { font-size: 32px; color: var(--gold-light); display: block; margin-bottom: 6px; }
.hero-blessing { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(15px,4vw,19px); color: var(--gold-light); margin-bottom: 24px; }
.hero-sub { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.hero-names { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(54px,16vw,88px); line-height: 1.05; color: #fff; text-shadow: 0 2px 20px rgba(0,0,0,.3); }
.hero-amp { display: block; font-size: .5em; color: var(--gold-light); margin: 4px 0; }
.hero-date {
  display: inline-flex; align-items: center; gap: 14px; margin-top: 26px;
  font-family: 'Cinzel', serif; font-size: clamp(12px,3.4vw,15px); letter-spacing: 3px; color: var(--gold-light);
}
.hero-date::before, .hero-date::after { content: '❋'; color: var(--marigold); font-size: 14px; }
.hero-place { margin-top: 6px; font-size: 13px; letter-spacing: 2px; color: rgba(251,244,232,.75); }
.scroll-hint { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2; color: var(--gold-light); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; }
.scroll-hint i { animation: tapBob 1.8s ease-in-out infinite; }

/* ============ SHARED ============ */
.kolam { display: flex; justify-content: center; margin: 44px 0; color: var(--gold); }
.kolam svg { width: 150px; height: 30px; }
.section-title { text-align: center; margin-bottom: 24px; }
.section-title small { display: block; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); }
.section-title h2 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: clamp(38px,10vw,50px); color: var(--maroon); line-height: 1.15; }
.card {
  background: var(--paper); border-radius: 18px; padding: clamp(26px,6vw,38px) clamp(20px,5vw,30px);
  box-shadow: 0 8px 34px rgba(74,15,24,.08); border: 1px solid rgba(193,154,75,.3);
  position: relative; overflow: hidden;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
  padding: 12px 18px; border-radius: 40px; border: 1px solid var(--maroon);
  font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none;
  color: var(--maroon); background: transparent; cursor: pointer; transition: background .25s, color .25s;
}
.btn:hover { background: var(--maroon); color: var(--cream); }
.btn.solid { background: var(--maroon); color: var(--cream); }
.btn.solid:hover { background: var(--maroon-dark); }

/* ============ COUPLE ============ */
#couple { padding-top: 60px; }
.couple-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; text-align: center; }
.portrait {
  width: 100%; max-width: 170px; aspect-ratio: 3/4; margin: 0 auto 14px; border-radius: 90px 90px 10px 10px; overflow: hidden; position: relative;
  border: 4px solid var(--paper); box-shadow: 0 0 0 1px var(--gold), 0 12px 30px rgba(74,15,24,.18);
  background: linear-gradient(160deg, var(--maroon), var(--maroon-dark));
}
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--gold-light); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
.ph i { font-size: 26px; opacity: .8; }
.couple-amp { font-family: 'Great Vibes', cursive; font-size: 44px; color: var(--gold); align-self: center; margin-top: -40px; }
.person-name { font-family: 'Cinzel', serif; font-size: clamp(14px,4.4vw,19px); font-weight: 500; color: var(--maroon); line-height: 1.3; }
.person-parents { font-size: 12.5px; color: var(--text); margin-top: 6px; line-height: 1.5; }
.person-town { display: block; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.invite-text { margin-top: 26px; text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.6; }
.invite-text em { display: block; font-size: 15px; color: var(--muted); margin-bottom: 6px; }

/* ============ STORY TIMELINE ============ */
.timeline { position: relative; padding-left: 34px; }
.timeline::before { content: ''; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--gold), var(--rose), var(--gold)); }
.moment { position: relative; margin-bottom: 26px; }
.moment:last-child { margin-bottom: 0; }
.moment-dot { position: absolute; left: -34px; top: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--paper); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--maroon); font-size: 10px; }
.moment-when { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; }
.moment-title { font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 600; color: var(--maroon-dark); line-height: 1.3; }
.moment-text { font-size: 14px; margin-top: 2px; }

/* ============ GALLERY ============ */
.gallery { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 18px 14px; margin: 0 -18px; scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.shot { flex: 0 0 72%; max-width: 300px; aspect-ratio: 4/5; scroll-snap-align: center; border-radius: 14px; overflow: hidden; position: relative; box-shadow: 0 8px 24px rgba(74,15,24,.15); background: linear-gradient(160deg, #8a3040, var(--maroon-dark)); }
.shot:nth-child(even) { background: linear-gradient(160deg, var(--gold), #8d6a26); }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-hint { text-align: center; font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

/* ============ EVENT TICKETS ============ */
.ticket {
  display: grid; grid-template-columns: 92px 1fr; margin-bottom: 18px;
  filter: drop-shadow(0 8px 22px rgba(74,15,24,.12));
}
.ticket-stub, .ticket-body {
  /* punched notches where stub meets body */
  --notch: radial-gradient(circle 10px at var(--nx) 0, transparent 10px, #000 10.5px) top / 100% 51% no-repeat,
           radial-gradient(circle 10px at var(--nx) 100%, transparent 10px, #000 10.5px) bottom / 100% 51% no-repeat;
  -webkit-mask: var(--notch); mask: var(--notch);
}
.ticket-stub {
  --nx: 100%;
  background: linear-gradient(170deg, var(--maroon), var(--maroon-dark)); color: var(--gold-light);
  border-radius: 16px 0 0 16px; padding: 20px 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  border-right: 2px dashed rgba(236,215,159,.5);
}
.stub-day { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: .85; }
.stub-date { font-family: 'Cinzel', serif; font-size: 40px; font-weight: 600; line-height: 1.05; color: #fff; }
.stub-month { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 2px; }
.ticket-body { --nx: 0; background: var(--paper); border-radius: 0 16px 16px 0; padding: 20px 18px 18px 20px; min-width: 0; }
.ticket-name { font-family: 'Great Vibes', cursive; font-size: 34px; color: var(--maroon); line-height: 1.1; }
.ticket-time { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.ticket-venue { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; color: var(--maroon-dark); margin-top: 10px; line-height: 1.3; }
.ticket-address { font-size: 13px; line-height: 1.5; }
.ticket-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.ticket-actions .btn { padding: 9px 12px; font-size: 10.5px; letter-spacing: 1px; flex: 1 1 auto; }
.map-slot { grid-column: 1 / -1; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s ease; }
.map-slot.open { grid-template-rows: 1fr; }
.map-slot > div { overflow: hidden; }
.map-slot iframe { width: 100%; height: 240px; border: 0; display: block; border-radius: 14px; margin-top: 10px; }

/* ============ COUNTDOWN ============ */
.countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cd-tile { background: var(--paper); border: 1px solid rgba(193,154,75,.45); border-radius: 14px; padding: 14px 4px 10px; text-align: center; position: relative; box-shadow: 0 6px 18px rgba(74,15,24,.07); }
.cd-tile::before { content: ''; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; transform: rotate(45deg); background: var(--marigold); border-radius: 2px; }
.cd-num { display: block; font-family: 'Cinzel', serif; font-size: clamp(26px,8vw,38px); color: var(--maroon); line-height: 1; }
.cd-num.flip { animation: flip .35s ease; }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(-90deg); opacity: 0; } 100% { transform: rotateX(0); opacity: 1; } }
.cd-word { display: block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.cd-done { text-align: center; font-family: 'Great Vibes', cursive; font-size: 40px; color: var(--maroon); }

/* ============ CLOSING ============ */
#closing { text-align: center; padding-bottom: calc(var(--nav-h) + 50px); }
.closing-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; }
.closing-names { font-family: 'Great Vibes', cursive; font-size: 44px; color: var(--maroon); margin-top: 10px; }
.closing-from { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.closing-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
footer { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); margin-top: 30px; }

/* ============ BOTTOM NAV ============ */
#nav {
  position: fixed; left: 50%; bottom: 12px; z-index: 50;
  width: min(420px, calc(100% - 24px)); height: var(--nav-h);
  transform: translate(-50%, 140%); transition: transform .5s cubic-bezier(.22,.61,.36,1);
  display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
  background: rgba(74,15,24,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(193,154,75,.5); border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  margin-bottom: env(safe-area-inset-bottom);
}
#nav.show { transform: translate(-50%, 0); }
#nav a, #nav button {
  display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; cursor: pointer;
  color: rgba(236,215,159,.7); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; transition: color .2s;
}
#nav [hidden] { display: none; }
#nav i { font-size: 17px; }
#nav a.active, #nav a:hover, #nav button:hover { color: #fff; }
#nav a.active i { color: var(--marigold-light); }
#music-btn.playing i { animation: beat 1.2s ease-in-out infinite; color: var(--marigold-light); }
@keyframes beat { 0%,100% { transform: scale(1); } 40% { transform: scale(1.2); } }
</style>
</head>
<body class="locked">

<!-- ============ TEMPLE DOORS ============ -->
<div id="doors">
  <div class="door door-left"></div>
  <div class="door door-right"></div>
  <button class="seal" id="open-btn" aria-label="Open the invitation">
    <span class="seal-for">You are invited</span>
    <span class="seal-circle" data-bind="monogram"></span>
    <span class="seal-tap"><i class="fa-solid fa-hand-pointer"></i> Tap to open</span>
  </button>
</div>

<div id="petals"></div>

<!-- ============ HERO ============ -->
<section id="home">
  <div class="garland" id="garland"></div>
  <svg class="mandala" id="mandala" viewBox="-200 -200 400 400" aria-hidden="true"></svg>
  <div class="hero-frame"></div>
  <div class="hero-inner">
    <span class="hero-symbol reveal" data-bind="symbol"></span>
    <p class="hero-blessing reveal" data-bind="blessing"></p>
    <p class="hero-sub reveal">The Wedding of</p>
    <h1 class="hero-names reveal">
      <span data-bind="bride.short"></span>
      <span class="hero-amp">&amp;</span>
      <span data-bind="groom.short"></span>
    </h1>
    <div class="hero-date reveal" data-bind="dateShort"></div>
    <p class="hero-place reveal" data-bind="city"></p>
  </div>
  <a class="scroll-hint" href="#couple"><span>Scroll</span><i class="fa-solid fa-chevron-down"></i></a>
</section>

<main class="page">

  <!-- ============ COUPLE ============ -->
  <section id="couple">
    <div class="section-title reveal">
      <small>With the blessings of our families</small>
      <h2>Bride &amp; Groom</h2>
    </div>
    <div class="couple-grid">
      <div class="reveal">
        <div class="portrait"><img data-photo="bride.photo" alt=""><div class="ph" hidden><i class="fa-solid fa-user"></i>Bride photo</div></div>
        <div class="person-name" data-bind="bride.full"></div>
        <p class="person-parents"><span data-bind="bride.parents"></span><span class="person-town" data-bind="bride.town"></span></p>
      </div>
      <div class="couple-amp reveal">&amp;</div>
      <div class="reveal">
        <div class="portrait"><img data-photo="groom.photo" alt=""><div class="ph" hidden><i class="fa-solid fa-user"></i>Groom photo</div></div>
        <div class="person-name" data-bind="groom.full"></div>
        <p class="person-parents"><span data-bind="groom.parents"></span><span class="person-town" data-bind="groom.town"></span></p>
      </div>
    </div>
    <p class="invite-text reveal"><em>cordially invite you</em><span data-bind="inviteText"></span></p>
  </section>

  <div class="kolam reveal" aria-hidden="true">
    <svg viewBox="0 0 150 30" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 15h45M105 15h45"/><path d="M75 3l12 12-12 12-12-12z"/><path d="M75 9l6 6-6 6-6-6z" fill="currentColor"/><circle cx="55" cy="15" r="3"/><circle cx="95" cy="15" r="3"/><circle cx="48" cy="15" r="1.5" fill="currentColor"/><circle cx="102" cy="15" r="1.5" fill="currentColor"/></svg>
  </div>

  <!-- ============ OUR STORY ============ -->
  <section id="story">
    <div class="section-title reveal">
      <small>How it all began</small>
      <h2>Our Story</h2>
    </div>
    <div class="card reveal"><div class="timeline" id="timeline"></div></div>
  </section>

  <div class="kolam reveal" aria-hidden="true">
    <svg viewBox="0 0 150 30" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 15h45M105 15h45"/><path d="M75 3l12 12-12 12-12-12z"/><path d="M75 9l6 6-6 6-6-6z" fill="currentColor"/><circle cx="55" cy="15" r="3"/><circle cx="95" cy="15" r="3"/><circle cx="48" cy="15" r="1.5" fill="currentColor"/><circle cx="102" cy="15" r="1.5" fill="currentColor"/></svg>
  </div>

  <!-- ============ GALLERY ============ -->
  <section id="gallery-section">
    <div class="section-title reveal">
      <small>Moments</small>
      <h2>Our Gallery</h2>
    </div>
    <div class="gallery reveal" id="gallery"></div>
    <p class="gallery-hint"><i class="fa-solid fa-arrows-left-right"></i> Swipe</p>
  </section>

  <div class="kolam reveal" aria-hidden="true">
    <svg viewBox="0 0 150 30" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 15h45M105 15h45"/><path d="M75 3l12 12-12 12-12-12z"/><path d="M75 9l6 6-6 6-6-6z" fill="currentColor"/><circle cx="55" cy="15" r="3"/><circle cx="95" cy="15" r="3"/><circle cx="48" cy="15" r="1.5" fill="currentColor"/><circle cx="102" cy="15" r="1.5" fill="currentColor"/></svg>
  </div>

  <!-- ============ EVENTS ============ -->
  <section id="events">
    <div class="section-title reveal">
      <small>Save the Date</small>
      <h2>Wedding Events</h2>
    </div>
    <div id="event-list"></div>
  </section>

  <!-- ============ COUNTDOWN ============ -->
  <section id="countdown-section" style="margin-top:36px">
    <div class="section-title reveal"><small>The big day is in</small></div>
    <div class="countdown-grid reveal" id="countdown">
      <div class="cd-tile"><span class="cd-num" id="cd-days">--</span><span class="cd-word">Days</span></div>
      <div class="cd-tile"><span class="cd-num" id="cd-hours">--</span><span class="cd-word">Hours</span></div>
      <div class="cd-tile"><span class="cd-num" id="cd-mins">--</span><span class="cd-word">Mins</span></div>
      <div class="cd-tile"><span class="cd-num" id="cd-secs">--</span><span class="cd-word">Secs</span></div>
    </div>
  </section>

  <!-- ============ CLOSING ============ -->
  <section id="closing">
    <div class="kolam reveal" aria-hidden="true">
      <svg viewBox="0 0 150 30" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 15h45M105 15h45"/><path d="M75 3l12 12-12 12-12-12z"/><path d="M75 9l6 6-6 6-6-6z" fill="currentColor"/><circle cx="55" cy="15" r="3"/><circle cx="95" cy="15" r="3"/><circle cx="48" cy="15" r="1.5" fill="currentColor"/><circle cx="102" cy="15" r="1.5" fill="currentColor"/></svg>
    </div>
    <p class="closing-quote reveal" data-bind="closingQuote"></p>
    <div class="closing-names reveal" data-bind="couple"></div>
    <p class="closing-from reveal" data-bind="closingFrom"></p>
    <div class="closing-actions reveal">
      <a class="btn solid" id="share-btn" target="_blank" rel="noopener"><i class="fa-solid fa-share-nodes"></i> Share Invite</a>
    </div>
    <footer data-bind="footer"></footer>
  </section>

</main>

<!-- ============ BOTTOM NAV ============ -->
<nav id="nav" aria-label="Sections">
  <a href="#home" data-sec="home"><i class="fa-solid fa-house"></i>Home</a>
  <a href="#story" data-sec="story"><i class="fa-solid fa-heart"></i>Story</a>
  <a href="#events" data-sec="events"><i class="fa-solid fa-calendar-days"></i>Events</a>
  <button id="music-btn" type="button" aria-label="Play or pause music"><i class="fa-solid fa-music"></i><span id="music-label">Music</span></button>
</nav>

<script>
/* ============================================================
   EDIT ONLY THIS SECTION — all names, dates, venues live here.
   • Dates use India time (+05:30).
   • Photos: put the files next to index.html with these names.
     Missing photos show a placeholder automatically.
   • Music: put "music.mp3" next to index.html.
   ============================================================ */
const CONFIG = {
  symbol: 'ॐ',                                   // set to '' to hide
  blessing: '|| Sri Ganeshaya Namah ||',
  city: 'Chennai, Tamil Nadu',

  bride: {
    short: 'Priya',
    full: 'Priya Ramesh',
    parents: 'D/o Mr. S. Ramesh & Mrs. R. Lakshmi',
    town: 'Chennai',
    photo: 'bride.jpg',
  },
  groom: {
    short: 'Karthik',
    full: 'Karthik Sundaram',
    parents: 'S/o Mr. K. Sundaram & Mrs. S. Meena',
    town: 'Coimbatore',
    photo: 'groom.jpg',
  },
  inviteText: 'to celebrate the wedding of our children and bless the couple as they begin their journey together.',

  story: [                                        // remove or add moments freely; [] hides the section
    { when: '2019', icon: 'fa-graduation-cap', title: 'First Hello', text: 'We met as classmates in college and bonded over endless canteen chai.' },
    { when: '2023', icon: 'fa-plane',          title: 'Miles Apart',  text: 'Different cities, same video call every night at 10 PM.' },
    { when: 'June 2026', icon: 'fa-ring',      title: 'The Engagement', text: 'With both families together, we said yes to forever.' },
    { when: 'Dec 2026',  icon: 'fa-heart',     title: 'Forever Begins', text: 'And now, we can\'t wait to celebrate with you!' },
  ],

  gallery: ['gallery1.jpg', 'gallery2.jpg', 'gallery3.jpg', 'gallery4.jpg'],   // [] hides the section

  events: [
    {
      name: 'Muhurtham',
      start: '2026-12-10T09:00:00+05:30',
      end:   '2026-12-10T10:30:00+05:30',
      timeText: '9:00 AM – 10:30 AM',
      venue: 'Sri Lakshmi Mahal',
      address: '12, Example Street, T. Nagar, Chennai – 600 017',
      mapQuery: 'T. Nagar, Chennai',               // text Google Maps can search, or exact venue name
      mapLink: 'https://maps.google.com/?q=T.+Nagar,+Chennai',
    },
    {
      name: 'Reception',
      start: '2026-12-10T18:30:00+05:30',
      end:   '2026-12-10T21:30:00+05:30',
      timeText: '6:30 PM onwards',
      venue: 'Grand Palace Convention Hall',
      address: '45, Sample Road, Anna Nagar, Chennai – 600 040',
      mapQuery: 'Anna Nagar, Chennai',
      mapLink: 'https://maps.google.com/?q=Anna+Nagar,+Chennai',
    },
  ],
  countdownTo: '2026-12-10T09:00:00+05:30',

  closingQuote: '"Your presence is the greatest gift we could ask for."',
  closingFrom: 'With love from both families',
  music: 'music.mp3',
};
/* ============================ END OF EDIT SECTION ============================ */

const TZ = 'Asia/Kolkata';
const fmt = (iso, opts) => new Intl.DateTimeFormat('en-IN', { timeZone: TZ, ...opts }).format(new Date(iso));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const firstEvent = CONFIG.events[0];
const couple = `${CONFIG.bride.short} & ${CONFIG.groom.short}`;

/* ── Text bindings ── */
const derived = {
  monogram: `${CONFIG.bride.short[0]}&${CONFIG.groom.short[0]}`,
  couple,
  dateShort: fmt(firstEvent.start, { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase(),
  footer: `© ${fmt(firstEvent.start, { year: 'numeric' })} · ${couple}`,
};
const lookup = path => path in derived ? derived[path] : path.split('.').reduce((o, k) => (o == null ? o : o[k]), CONFIG);
document.querySelectorAll('[data-bind]').forEach(el => {
  const v = lookup(el.dataset.bind);
  if (v == null || v === '') el.hidden = true; else el.textContent = v;
});
document.title = `${couple} — Wedding Invitation`;

/* ── Photos with placeholder fallback ── */
function loadPhoto(img, src) {
  img.hidden = true;                             // stay hidden until it actually loads, so no broken-image icon flashes
  img.onload = () => { img.hidden = false; };
  img.onerror = () => { if (img.nextElementSibling) img.nextElementSibling.hidden = false; };
  img.src = src;
}
document.querySelectorAll('img[data-photo]').forEach(img => loadPhoto(img, lookup(img.dataset.photo)));

/* ── Garland (thoranam) ── */
const leafSVG = '<svg viewBox="0 0 20 50"><path d="M10 0C20 14 19 34 10 50 1 34 0 14 10 0Z" fill="var(--leaf)"/><path d="M10 3V47" stroke="var(--leaf-dark)" stroke-width="1"/></svg>';
function buildGarland() {
  const g = document.getElementById('garland');
  const count = Math.max(9, Math.round(g.clientWidth / 24));
  let html = '';
  for (let i = 0; i < count; i++) {
    const delay = (-Math.random() * 3).toFixed(2);
    html += i % 3 === 1
      ? `<div class="garland-item flower" style="animation-delay:${delay}s"><span></span><span></span><span></span></div>`
      : `<div class="garland-item" style="animation-delay:${delay}s">${leafSVG}</div>`;
  }
  g.innerHTML = html;
}
buildGarland();
addEventListener('resize', () => { clearTimeout(buildGarland.t); buildGarland.t = setTimeout(buildGarland, 200); });

/* ── Mandala ── */
(function () {
  const m = document.getElementById('mandala');
  let s = '<g fill="none" stroke="currentColor" stroke-width="1">';
  s += '<circle r="190"/><circle r="182" stroke-dasharray="2 6"/><circle r="120"/><circle r="60"/><circle r="30"/>';
  for (let i = 0; i < 24; i++) s += `<ellipse rx="16" ry="50" cy="-150" transform="rotate(${i * 15})"/>`;
  for (let i = 0; i < 16; i++) s += `<ellipse rx="12" ry="32" cy="-88" transform="rotate(${i * 22.5 + 11.25})"/>`;
  for (let i = 0; i < 12; i++) s += `<path d="M0-30 Q10-45 0-60 Q-10-45 0-30Z" transform="rotate(${i * 30})"/>`;
  for (let i = 0; i < 36; i++) s += `<circle r="2.5" cy="-190" fill="currentColor" transform="rotate(${i * 10})"/>`;
  m.innerHTML = s + '</g>';
})();

/* ── Story ── */
if (!CONFIG.story.length) document.getElementById('story').hidden = true;
document.getElementById('timeline').innerHTML = CONFIG.story.map(m => `
  <div class="moment">
    <div class="moment-dot"><i class="fa-solid ${esc(m.icon || 'fa-heart')}"></i></div>
    <div class="moment-when">${esc(m.when)}</div>
    <div class="moment-title">${esc(m.title)}</div>
    <p class="moment-text">${esc(m.text)}</p>
  </div>`).join('');

/* ── Gallery ── */
if (!CONFIG.gallery.length) document.getElementById('gallery-section').hidden = true;
const gal = document.getElementById('gallery');
gal.innerHTML = CONFIG.gallery.map((_, i) => `<div class="shot"><img alt="Photo ${i + 1}"><div class="ph" hidden><i class="fa-regular fa-image"></i>Photo ${i + 1}</div></div>`).join('');
gal.querySelectorAll('img').forEach((img, i) => loadPhoto(img, CONFIG.gallery[i]));

/* ── Event tickets ── */
document.getElementById('event-list').innerHTML = CONFIG.events.map((ev, i) => `
  <article class="reveal">
    <div class="ticket">
      <div class="ticket-stub">
        <span class="stub-day">${fmt(ev.start, { weekday: 'short' })}</span>
        <span class="stub-date">${fmt(ev.start, { day: '2-digit' })}</span>
        <span class="stub-month">${fmt(ev.start, { month: 'short', year: 'numeric' }).toUpperCase()}</span>
      </div>
      <div class="ticket-body">
        <div class="ticket-name">${esc(ev.name)}</div>
        <div class="ticket-time"><i class="fa-regular fa-clock"></i>${esc(ev.timeText)}</div>
        <div class="ticket-venue">${esc(ev.venue)}</div>
        <div class="ticket-address">${esc(ev.address)}</div>
        <div class="ticket-actions">
          <button class="btn" type="button" onclick="toggleMap(${i}, this)"><i class="fa-solid fa-map-location-dot"></i> <span>Show map</span></button>
          <button class="btn" type="button" onclick="addToCalendar(${i})"><i class="fa-regular fa-calendar-plus"></i> Calendar</button>
          <a class="btn solid" href="${esc(ev.mapLink)}" target="_blank" rel="noopener"><i class="fa-solid fa-diamond-turn-right"></i> Directions</a>
        </div>
      </div>
      <div class="map-slot" id="map-${i}"><div></div></div>
    </div>
  </article>`).join('');

function toggleMap(i, btn) {
  const slot = document.getElementById('map-' + i), inner = slot.firstElementChild, ev = CONFIG.events[i];
  if (!inner.innerHTML) {
    inner.innerHTML = `<iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map to ${esc(ev.venue)}"
      src="https://maps.google.com/maps?q=${encodeURIComponent(ev.mapQuery)}&z=15&output=embed"></iframe>`;
  }
  const open = slot.classList.toggle('open');
  btn.querySelector('span').textContent = open ? 'Hide map' : 'Show map';
}

/* ── Doors + music ── */
const audio = new Audio();
audio.loop = true; audio.volume = 0.45;
let hasMusic = false;
audio.addEventListener('canplay', () => { hasMusic = true; }, { once: true });
audio.addEventListener('error', () => { document.getElementById('music-btn').hidden = true; document.getElementById('nav').style.gridTemplateColumns = 'repeat(3, 1fr)'; });
audio.src = CONFIG.music;
audio.load();

const musicBtn = document.getElementById('music-btn');
function setPlaying(on) {
  musicBtn.classList.toggle('playing', on);
  musicBtn.querySelector('i').className = on ? 'fa-solid fa-volume-high' : 'fa-solid fa-music';
  document.getElementById('music-label').textContent = on ? 'Pause' : 'Music';
}
function playMusic() { audio.play().then(() => setPlaying(true)).catch(() => {}); }
musicBtn.addEventListener('click', () => { if (audio.paused) playMusic(); else { audio.pause(); setPlaying(false); } });

document.getElementById('open-btn').addEventListener('click', () => {
  const doors = document.getElementById('doors');
  doors.classList.add('open', 'gone');
  document.body.classList.remove('locked');
  playMusic();                                   // tap counts as user gesture, so autoplay is allowed
  burstPetals();
  document.querySelectorAll('#home .reveal').forEach((el, i) => setTimeout(() => el.classList.add('visible'), 700 + i * 170));
});

/* ── Petals: a burst when doors open, then a gentle drift ── */
const petals = document.getElementById('petals');
const petalColors = ['#f29a1f', '#ffc94a', '#e9b8b0', '#d9534f', '#f6e3d3'];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function petal(maxDelay) {
  const p = document.createElement('div');
  const size = 7 + Math.random() * 10, dur = 7 + Math.random() * 8, delay = Math.random() * maxDelay;
  p.className = 'petal';
  p.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size * .7}px;background:${petalColors[Math.random() * petalColors.length | 0]};border-radius:${Math.random() > .5 ? '50% 0 50% 0' : '0 50% 0 50%'};animation-duration:${dur}s;animation-delay:${delay}s;`;
  petals.appendChild(p);
  setTimeout(() => p.remove(), (dur + delay) * 1000 + 300);
}
function burstPetals() {
  if (reduced) return;
  for (let i = 0; i < 40; i++) petal(1.5);
  setInterval(() => petal(0), 1400);
}

/* ── Scroll reveal ── */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
document.querySelectorAll('.reveal').forEach(el => { if (!el.closest('#home')) io.observe(el); });

/* ── Bottom nav: show after hero, highlight current section ── */
const nav = document.getElementById('nav');
new IntersectionObserver(([e]) => nav.classList.toggle('show', !e.isIntersecting), { threshold: 0.35 })
  .observe(document.getElementById('home'));
const navLinks = [...nav.querySelectorAll('a[data-sec]')];
const secObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle('active', a.dataset.sec === e.target.id));
  });
}, { rootMargin: '-45% 0px -50% 0px' });
navLinks.forEach(a => { const s = document.getElementById(a.dataset.sec); if (s) secObserver.observe(s); });

/* ── Countdown ── */
const target = new Date(CONFIG.countdownTo);
function setNum(id, val) {
  const el = document.getElementById(id), s = String(val).padStart(2, '0');
  if (el.textContent !== s) { el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); el.textContent = s; }
}
function tick() {
  const diff = target - new Date();
  if (diff <= 0) {
    document.getElementById('countdown').outerHTML = '<p class="cd-done">Just Married!</p>';
    clearInterval(timer);
    return;
  }
  setNum('cd-days', Math.floor(diff / 86400000));
  setNum('cd-hours', Math.floor(diff % 86400000 / 3600000));
  setNum('cd-mins', Math.floor(diff % 3600000 / 60000));
  setNum('cd-secs', Math.floor(diff % 60000 / 1000));
}
const timer = setInterval(tick, 1000);
tick();

/* ── Add to calendar (.ics) ── */
const icsDate = iso => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const icsText = s => String(s).replace(/[\\,;]/g, m => '\\' + m);
function addToCalendar(i) {
  const ev = CONFIG.events[i];
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wedding Invite//EN',
    'BEGIN:VEVENT',
    `UID:${icsDate(ev.start)}-${i}@wedding-invite`,
    `DTSTAMP:${icsDate(new Date().toISOString())}`,
    `DTSTART:${icsDate(ev.start)}`,
    `DTEND:${icsDate(ev.end)}`,
    `SUMMARY:${icsText(`${ev.name} — ${couple}`)}`,
    `LOCATION:${icsText(`${ev.venue}, ${ev.address}`)}`,
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  a.download = `${ev.name.replace(/\s+/g, '-')}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ── Share ── */
const shareBtn = document.getElementById('share-btn');
const shareText = `You're invited to the wedding of ${couple}! 💐`;
shareBtn.href = 'https://wa.me/?text=' + encodeURIComponent(`${shareText}\n${location.href}`);
shareBtn.addEventListener('click', e => {
  if (navigator.share) { e.preventDefault(); navigator.share({ title: document.title, text: shareText, url: location.href }).catch(() => {}); }
});
</script>
</body>
</html>
