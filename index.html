<style>
:root {
  --navy: #0b2547;
  --navy-2: #0f2d56;
  --navy-3: #163b6e;
  --ink: #f2f5fa;
  --muted: rgba(226,234,246,.72);
  --line: rgba(226,234,246,.16);
  --sky: #a9c0de;
  --blush: #ecc5c7;
  --gold: #c9a45c;
  --gold-light: #e6cf9a;
  --paper: #f7f2e8;
  --paper-ink: #1b2f50;
  --paper-muted: #5d6f8f;
  --display: 'Cinzel', 'Times New Roman', serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Jost', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--navy);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.6;
  overflow-x: hidden;
}
body.locked { overflow: hidden; height: 100svh; }
a { color: inherit; }
button { font: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }

.label {
  font-family: var(--sans); font-weight: 400; font-size: 11px;
  letter-spacing: .28em; text-transform: uppercase; color: var(--sky);
}
.wrap { max-width: 440px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

/* ============ COVER ============ */
#cover {
  position: fixed; inset: 0; z-index: 9999; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 45%, var(--navy-3) 0%, var(--navy) 70%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
  transition: transform 1s cubic-bezier(.7,0,.3,1), opacity .8s ease .3s;
}
#cover.open { transform: translateY(-100%); opacity: 0; pointer-events: none; }
.cover-floral { position: absolute; width: min(62vw, 300px); pointer-events: none; opacity: .95; }
.cover-floral.tl { top: -2%; left: -8%; }
.cover-floral.br { bottom: -2%; right: -8%; transform: rotate(180deg); }
.cover-frame {
  position: absolute; inset: 14px; border: 1px solid rgba(201,164,92,.35); border-radius: 18px; pointer-events: none;
}
.cover-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
.cover-content .label { color: var(--gold-light); }
.mandala-wrap {
  position: relative; width: min(80vw, 330px); aspect-ratio: 1; margin: 0 auto;
  background: none; border: 0; cursor: pointer; display: block;
}
.mandala-wrap::before {
  content: ''; position: absolute; inset: 12%; border-radius: 50%;
  background: radial-gradient(circle, rgba(230,207,154,.28) 0%, rgba(230,207,154,0) 70%);
}
.mandala { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--gold-light); overflow: visible; }
.mandala .spin { transform-origin: 0 0; animation: spin 80s linear infinite; }
.mandala .spin-rev { transform-origin: 0 0; animation: spin 50s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.mandala-mono {
  position: absolute; left: 50%; top: 50%; width: 30%; transform: translate(-50%, -50%);
  filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
}
.cover-btn {
  margin-top: 36px; display: inline-flex; align-items: center; gap: 10px;
  padding: 13px 26px; border-radius: 40px; border: 1px solid var(--gold);
  background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: var(--navy);
  font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
  cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,.3);
}
.cover-btn i { font-size: 13px; }

/* ============ REVEAL ============ */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity .9s ease, transform .9s ease; }
.reveal.visible { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  #cover { transition-duration: .01s; }
  .mandala .spin, .mandala .spin-rev, .sparkle { animation: none !important; }
}

/* ============ HERO ============ */
#home { position: relative; overflow: hidden; padding: 84px 0 36px; text-align: center; }
.arch-wrap { position: relative; width: 78%; max-width: 290px; margin: 0 auto; }
.arch {
  position: relative; aspect-ratio: 3 / 3.6;
  border-radius: 999px 999px 18px 18px; overflow: hidden;
  background: linear-gradient(180deg, #dce6f3 0%, #f4efe6 100%);
  border: 1px solid rgba(201,164,92,.7);
  box-shadow: 0 0 0 5px var(--navy), 0 0 0 6px rgba(201,164,92,.55), 0 18px 40px rgba(0,0,0,.4);
}
.arch img { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 92%; height: auto; }
.hero-floral { position: absolute; top: 0; width: min(44vw, 200px); pointer-events: none; z-index: 0; }
.hero-floral.tl { left: 0; }
.hero-floral.tr { right: 0; transform: scaleX(-1); }
.hero-kicker { margin-top: 44px; }
.hero-names { font-family: var(--display); font-weight: 500; font-size: 30px; letter-spacing: .12em; line-height: 1.25; color: #fff; margin-top: 8px; }
.hero-names .amp { display: block; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 26px; letter-spacing: 0; color: var(--gold-light); margin: 2px 0; }
.hero-date { display: flex; align-items: center; justify-content: center; margin-top: 22px; }
.hero-date > span { font-family: var(--sans); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink); padding: 8px 14px; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); }
.hero-date > b { font-family: var(--display); font-weight: 500; font-size: 40px; line-height: 1; color: var(--gold-light); padding: 0 16px; }
.scroll-hint {
  display: inline-flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 28px;
  font-family: var(--sans); font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--muted); text-decoration: none;
}
.scroll-hint i { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* ============ SECTION HEADINGS ============ */
section { padding: 44px 0; }
.heading { text-align: center; margin-bottom: 22px; }
.heading h2 { font-family: var(--display); font-weight: 500; font-size: 25px; letter-spacing: .1em; line-height: 1.3; color: #fff; margin-top: 6px; }
.flourish { display: block; width: 120px; height: 18px; margin: 4px auto 0; color: var(--gold); }

/* ============ INVITATION CARD ============ */
.paper {
  background: var(--paper); color: var(--paper-ink); border-radius: 18px;
  padding: 34px 22px 30px; text-align: center; position: relative;
  box-shadow: 0 18px 40px rgba(0,0,0,.35);
}
.paper::before {
  content: ''; position: absolute; inset: 8px; border: 1px solid rgba(201,164,92,.55); border-radius: 12px; pointer-events: none;
}
.paper .label { color: var(--paper-muted); }
.blessing { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--paper-muted); }
.invite-lead { font-size: 17px; line-height: 1.55; margin: 14px auto 0; max-width: 300px; }
.person { margin-top: 20px; }
.person-name { font-family: var(--display); font-weight: 600; font-size: 24px; letter-spacing: .08em; line-height: 1.3; color: var(--navy-3); }
.person-parents { font-family: var(--sans); font-size: 12px; letter-spacing: .06em; color: var(--paper-muted); margin-top: 2px; }
.person-parents b { display: block; font-weight: 500; color: var(--paper-ink); letter-spacing: .02em; font-size: 13px; }
.with { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--gold); margin-top: 16px; line-height: 1; }
.invite-close { font-size: 16px; font-style: italic; margin-top: 24px; line-height: 1.55; }

/* ============ EVENTS ============ */
.event {
  background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 18px;
  overflow: hidden; margin-bottom: 18px;
}
.event-head {
  text-align: center; padding: 22px 18px 16px;
  background: linear-gradient(180deg, rgba(201,164,92,.14), transparent);
  border-bottom: 1px solid rgba(201,164,92,.3);
}
.event-icon {
  width: 42px; height: 42px; margin: 0 auto 10px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: var(--navy); font-size: 16px;
}
.event-name { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; line-height: 1.2; color: var(--gold-light); }
.event-head .label { margin-top: 4px; color: var(--ink); }
.event-body { padding: 14px 18px 18px; }
.row { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; }
.row:first-child { margin-top: 0; }
.row i { width: 16px; flex: 0 0 16px; text-align: center; color: var(--gold-light); font-size: 13px; margin-top: 5px; }
.row-main { font-size: 18px; font-weight: 600; line-height: 1.35; }
.row-sub { font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--muted); }
.event-map { display: block; width: 100%; height: 170px; border: 0; border-radius: 12px; margin-top: 16px; background: var(--navy-2); }
.event-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 10px; border-radius: 40px; border: 1px solid rgba(226,234,246,.4);
  font-family: var(--sans); font-size: 11.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  text-decoration: none; color: #fff; background: transparent; cursor: pointer;
}
.btn.gold { background: linear-gradient(135deg, var(--gold-light), var(--gold)); border-color: var(--gold); color: var(--navy); }

/* ============ COUNTDOWN ============ */
.countdown-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cd-tile { border: 1px solid var(--line); border-radius: 14px; padding: 14px 2px 10px; text-align: center; background: rgba(255,255,255,.04); }
.cd-num { display: block; font-family: var(--serif); font-size: 30px; font-weight: 500; line-height: 1; }
.cd-word { display: block; font-family: var(--sans); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--sky); margin-top: 6px; }
.cd-done { text-align: center; font-family: var(--display); font-size: 26px; letter-spacing: .1em; }

/* ============ CLOSING ============ */
#closing { text-align: center; padding: 50px 0 40px; position: relative; overflow: hidden; }
.closing-quote { font-size: 18px; font-style: italic; line-height: 1.6; max-width: 320px; margin: 0 auto; }
.closing-names { font-family: var(--display); font-weight: 500; font-size: 24px; letter-spacing: .1em; line-height: 1.3; margin-top: 16px; color: #fff; }
.closing-from { margin-top: 4px; }
.closing-floral { position: absolute; bottom: 20px; left: -30px; width: min(36vw, 160px); opacity: .6; pointer-events: none; }
#share-btn { margin-top: 24px; padding: 12px 22px; }
footer { font-family: var(--sans); font-size: 11px; letter-spacing: .12em; color: var(--muted); margin-top: 34px; }

/* ============ DECOR ============ */
.sparkle {
  position: absolute; width: 3px; height: 3px; border-radius: 50%; pointer-events: none; z-index: 0;
  background: var(--gold-light); box-shadow: 0 0 6px 1px rgba(230,207,154,.7); opacity: 0;
  animation: twinkle ease-in-out infinite;
}
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.6); } 50% { opacity: .8; transform: scale(1); } }


/* very small phones */
@media (max-width: 350px) {
  body { font-size: 16px; }
  .hero-names { font-size: 26px; }
  .heading h2, .closing-names, .person-name { font-size: 21px; }
  .cd-num { font-size: 26px; }
  .hero-date > span { font-size: 11px; letter-spacing: .16em; padding: 8px 8px; }
  .hero-date > b { font-size: 34px; padding: 0 10px; }
  .event-actions { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="locked">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flourish" viewBox="0 0 200 30" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
    <g id="fl-half">
      <path d="M92 15 C84 15 80 7 71 8 C62 9 62 21 70 20 C76 19 75 12 70 13"/>
      <path d="M71 8 C56 3 46 21 30 16 C22 13 14 15 4 15"/>
      <path d="M46 13 C42 6 33 7 35 12 C36 15 40 14 39 12"/>
    </g>
    <use href="#fl-half" transform="translate(200 0) scale(-1 1)"/>
    <path d="M100 9 L105 15 L100 21 L95 15 Z" fill="currentColor" stroke="none"/>
  </symbol>
</svg>

<!-- ============ COVER ============ -->
<div id="cover">
  <img class="cover-floral tl" src="assets/floral-blue.webp" alt="">
  <img class="cover-floral br" src="assets/floral-blue.webp" alt="">
  <div class="cover-frame"></div>
  <div class="cover-content">
    <button class="mandala-wrap" id="seal-btn" type="button" aria-label="View the invitation">
      <svg class="mandala" id="mandala" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
      <img class="mandala-mono" src="assets/monogram.webp" alt="">
    </button>
    <button class="cover-btn" id="open-btn" type="button"><i class="fa-regular fa-envelope-open"></i> View Invitation</button>
  </div>
</div>

<!-- ============ HERO ============ -->
<section id="home">
  <img class="hero-floral tl" src="assets/floral-blue.webp" alt="">
  <img class="hero-floral tr" src="assets/floral-blue.webp" alt="">
  <div class="wrap">
    <div class="arch-wrap reveal">
      <div class="arch"><img src="assets/couple.webp" alt="Illustration of the couple exchanging garlands"></div>
    </div>
    <p class="label hero-kicker reveal">The wedding of</p>
    <h1 class="hero-names reveal">
      <span data-bind="groom.short"></span>
      <span class="amp">&amp;</span>
      <span data-bind="bride.short"></span>
    </h1>
    <div class="hero-date reveal"><span data-bind="weekday"></span><b data-bind="day"></b><span data-bind="monthYear"></span></div>
    <a class="scroll-hint" href="#invite"><span>Scroll</span><i class="fa-solid fa-chevron-down"></i></a>
  </div>
</section>

<main>

  <!-- ============ INVITATION ============ -->
  <section id="invite">
    <div class="wrap">
      <div class="paper reveal">
        <p class="blessing" data-bind="blessing"></p>
        <p class="invite-lead" data-bind="inviteLead"></p>
        <div class="person">
          <div class="person-name" data-bind="groom.full"></div>
          <div class="person-parents"><span data-bind="groom.relation"></span><b data-bind="groom.parents"></b></div>
        </div>
        <div class="with">with</div>
        <div class="person">
          <div class="person-name" data-bind="bride.full"></div>
          <div class="person-parents"><span data-bind="bride.relation"></span><b data-bind="bride.parents"></b></div>
        </div>
        <p class="invite-close" data-bind="inviteClose"></p>
      </div>
    </div>
  </section>

  <!-- ============ EVENTS ============ -->
  <section id="events">
    <div class="wrap">
      <div class="heading reveal">
        <p class="label">Join us for</p>
        <h2>The Celebrations</h2>
      </div>
      <div id="event-list"></div>
    </div>
  </section>

  <!-- ============ COUNTDOWN ============ -->
  <section id="countdown-section">
    <div class="wrap">
      <div class="heading reveal">
        <p class="label">Counting down to</p>
        <h2>The Big Day</h2>
      </div>
      <div class="countdown-grid reveal" id="countdown">
        <div class="cd-tile"><span class="cd-num" id="cd-days">--</span><span class="cd-word">Days</span></div>
        <div class="cd-tile"><span class="cd-num" id="cd-hours">--</span><span class="cd-word">Hours</span></div>
        <div class="cd-tile"><span class="cd-num" id="cd-mins">--</span><span class="cd-word">Mins</span></div>
        <div class="cd-tile"><span class="cd-num" id="cd-secs">--</span><span class="cd-word">Secs</span></div>
      </div>
    </div>
  </section>

</main>

<!-- ============ CLOSING ============ -->
<section id="closing">
  <img class="closing-floral" src="assets/floral-white.webp" alt="">
  <div class="wrap">
    <p class="closing-quote reveal" data-bind="closingQuote"></p>
    <div class="closing-names reveal" data-bind="couple"></div>
    <p class="label closing-from reveal" data-bind="closingFrom"></p>
    <a class="btn gold reveal" id="share-btn" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Share Invitation</a>
    <footer data-bind="footer"></footer>
  </div>
</section>

<script>
/* ============================================================
   EDIT ONLY THIS SECTION — all names, dates, venues live here.
   • Dates use India time (+05:30).
   ============================================================ */
const CONFIG = {
  groom: {
    short: 'Balaji',
    full: 'B. Balaji',
    relation: 'Son of',
    parents: 'Mr. P. Baskaran & Mrs. B. Lakshmi',
  },
  bride: {
    short: 'Krithika',
    full: 'S. Krithika',
    relation: 'Daughter of',
    parents: 'Mr. K. Sivakumar & Mrs. S. Sakunthala',
  },
  blessing: 'With the blessings of the Almighty',
  inviteLead: 'We joyfully request the pleasure of your company at the wedding of',
  inviteClose: 'Your presence and blessings would make our special day complete.',


  events: [
    {
      name: 'Muhurtham',
      icon: 'fa-heart',
      start: '2026-12-13T07:30:00+05:30',
      end:   '2026-12-13T09:00:00+05:30',
      timeText: '7:30 AM – 9:00 AM',
      venue: 'Sri Vedapureeswarar Temple',
      address: 'Karpagambal Nagar, Thiruverkadu, Chennai – 600 077',
      mapQuery: 'Vedapureeswarar Temple, Karpagambal Nagar, Thiruverkadu, Tamil Nadu 600077',
      mapLink: 'https://maps.app.goo.gl/LoSyBvPao5cSieEQ9',
    },
    {
      name: 'Reception',
      icon: 'fa-champagne-glasses',
      start: '2026-12-13T18:00:00+05:30',
      end:   '2026-12-13T21:30:00+05:30',
      timeText: 'From 6:00 PM onwards',
      venue: 'Kasthuri Mahal',
      address: '6/101, Avadi Road, Periyar Nagar, Poonamallee, Chennai – 600 056',
      mapQuery: 'Kasthuri Mahal, 6/101, Avadi Rd, Poonamallee, Tamil Nadu 600056',
      mapLink: 'https://maps.app.goo.gl/p87NBhuAiSfnQg1Y8',
    },
  ],
  countdownTo: '2026-12-13T07:30:00+05:30',

  closingQuote: 'Your presence is the greatest gift we could ask for.',
  closingFrom: 'With love from both families',
};
/* ============================ END OF EDIT SECTION ============================ */

const TZ = 'Asia/Kolkata';
const fmt = (iso, opts) => new Intl.DateTimeFormat('en-IN', { timeZone: TZ, ...opts }).format(new Date(iso));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const firstEvent = CONFIG.events[0];
const couple = `${CONFIG.groom.short} & ${CONFIG.bride.short}`;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── Text bindings ── */
const derived = {
  couple,
  weekday: fmt(firstEvent.start, { weekday: 'long' }),
  day: fmt(firstEvent.start, { day: '2-digit' }),
  monthYear: fmt(firstEvent.start, { month: 'short', year: 'numeric' }),
  footer: `© ${fmt(firstEvent.start, { year: 'numeric' })} · ${couple}`,
};
const lookup = path => path in derived ? derived[path] : path.split('.').reduce((o, k) => (o == null ? o : o[k]), CONFIG);
document.querySelectorAll('[data-bind]').forEach(el => {
  const v = lookup(el.dataset.bind);
  if (v == null || v === '') el.hidden = true; else el.textContent = v;
});
document.title = `${couple} — Wedding Invitation`;

/* ── Events ── */
document.getElementById('event-list').innerHTML = CONFIG.events.map((ev, i) => `
  <article class="event reveal">
    <div class="event-head">
      <div class="event-icon"><i class="fa-solid ${esc(ev.icon || 'fa-heart')}"></i></div>
      <div class="event-name">${esc(ev.name)}</div>
      <div class="label">${fmt(ev.start, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
    </div>
    <div class="event-body">
      <div class="row"><i class="fa-regular fa-clock"></i><div class="row-main">${esc(ev.timeText)}</div></div>
      <div class="row"><i class="fa-solid fa-location-dot"></i><div><div class="row-main">${esc(ev.venue)}</div><div class="row-sub">${esc(ev.address)}</div></div></div>
      <iframe class="event-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map to ${esc(ev.venue)}"
        src="https://maps.google.com/maps?q=${encodeURIComponent(ev.mapQuery)}&z=15&output=embed"></iframe>
      <div class="event-actions">
        <a class="btn gold" href="${esc(ev.mapLink)}" target="_blank" rel="noopener"><i class="fa-solid fa-diamond-turn-right"></i> Directions</a>
        <button class="btn" type="button" onclick="addToCalendar(${i})"><i class="fa-regular fa-calendar-plus"></i> Save Date</button>
      </div>
    </div>
  </article>`).join('');

/* ── Gold flourish under each heading ── */
document.querySelectorAll('.heading h2').forEach(h =>
  h.insertAdjacentHTML('afterend', '<svg class="flourish" aria-hidden="true"><use href="#flourish"/></svg>'));

/* ── Cover mandala: gold kolam line-art drawn from rings of petals ── */
(function () {
  const ring = (n, d, extra = '') => Array.from({ length: n }, (_, i) =>
    `<path d="${d}" transform="rotate(${i * 360 / n})" ${extra}/>`).join('');
  const dots = (n, r, size) => Array.from({ length: n }, (_, i) =>
    `<circle cx="0" cy="${-r}" r="${size}" transform="rotate(${i * 360 / n + 180 / n})" fill="currentColor" stroke="none"/>`).join('');
  document.getElementById('mandala').innerHTML = `
    <g fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round">
      <g class="spin">
        <circle r="97" opacity=".5"/>
        ${ring(32, 'M0,-97 C3,-93 3,-88 0,-85 C-3,-88 -3,-93 0,-97Z')}
        ${dots(32, 92, .9)}
        <circle r="84"/>
        ${ring(16, 'M0,-84 C12,-76 12,-62 0,-54 C-12,-62 -12,-76 0,-84Z')}
        ${ring(16, 'M0,-80 C6,-74 6,-64 0,-58 C-6,-64 -6,-74 0,-80Z', 'opacity=".6"')}
      </g>
      <g class="spin-rev">
        ${dots(16, 70, 1.4)}
        <circle r="54"/>
        <circle r="50" opacity=".5" stroke-dasharray="1.5 3"/>
        ${ring(12, 'M0,-50 C9,-44 9,-36 0,-30 C-9,-36 -9,-44 0,-50Z')}
        ${dots(12, 30, 1.1)}
      </g>
      <circle r="31" fill="var(--navy)" stroke-width="1"/>
      <circle r="28" opacity=".5"/>
    </g>`;
})();

/* ── Sparkles ── */
if (!reduced) ['cover', 'home', 'closing'].forEach(id => {
  const host = document.getElementById(id);
  for (let i = 0; i < 14; i++) {
    const sp = document.createElement('span');
    sp.className = 'sparkle';
    sp.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-duration:${3 + Math.random() * 4}s;animation-delay:${-Math.random() * 6}s;`;
    host.appendChild(sp);
  }
});

/* ── Cover ── */
function openInvite() {
  document.getElementById('cover').classList.add('open');
  document.body.classList.remove('locked');
  document.querySelectorAll('#home .reveal').forEach((el, i) => setTimeout(() => el.classList.add('visible'), 500 + i * 200));
}
document.getElementById('open-btn').addEventListener('click', openInvite);
document.getElementById('seal-btn').addEventListener('click', openInvite);

/* ── Scroll reveal ── */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
document.querySelectorAll('.reveal').forEach(el => { if (!el.closest('#home')) io.observe(el); });

/* ── Countdown ── */
const target = new Date(CONFIG.countdownTo);
function setNum(id, val) { document.getElementById(id).textContent = String(val).padStart(2, '0'); }
function tick() {
  const diff = target - new Date();
  if (diff <= 0) {
    document.getElementById('countdown').outerHTML = '<p class="cd-done">Just Married!</p>';
    clearInterval(timer);
    return;
  }
  setNum('cd-days', Math.floor(diff / 86400000));
  setNum('cd-hours', Math.floor(diff % 86400000 / 3600000));
  setNum('cd-mins', Math.floor(diff % 3600000 / 60000));
  setNum('cd-secs', Math.floor(diff % 60000 / 1000));
}
const timer = setInterval(tick, 1000);
tick();

/* ── Add to calendar (.ics) ── */
const icsDate = iso => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const icsText = s => String(s).replace(/[\\,;]/g, m => '\\' + m);
function addToCalendar(i) {
  const ev = CONFIG.events[i];
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wedding Invite//EN',
    'BEGIN:VEVENT',
    `UID:${icsDate(ev.start)}-${i}@wedding-invite`,
    `DTSTAMP:${icsDate(new Date().toISOString())}`,
    `DTSTART:${icsDate(ev.start)}`,
    `DTEND:${icsDate(ev.end)}`,
    `SUMMARY:${icsText(`${ev.name} — ${couple}`)}`,
    `LOCATION:${icsText(`${ev.venue}, ${ev.address}`)}`,
    `URL:${ev.mapLink}`,
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  a.download = `${ev.name.replace(/\s+/g, '-')}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ── Share ── */
const shareBtn = document.getElementById('share-btn');
const shareText = `You're invited to the wedding of ${couple}! 💐`;
shareBtn.href = 'https://wa.me/?text=' + encodeURIComponent(`${shareText}\n${location.href}`);
shareBtn.addEventListener('click', e => {
  if (navigator.share) { e.preventDefault(); navigator.share({ title: document.title, text: shareText, url: location.href }).catch(() => {}); }
});
</script>
</body>
</html>
